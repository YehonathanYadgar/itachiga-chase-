<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Shooter 🎯</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJS — free P2P signalling, no server needed -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <!-- CLASS SELECT -->
  <div id="class-select">
    <h1>🎯 FRIEND SHOOTER</h1>
    <p class="sub">Choose your fighter</p>
    <div id="class-grid"></div>
  </div>

  <!-- POINTER LOCK OVERLAY (innerHTML gets replaced on pause — keep invite outside) -->
  <div id="overlay" style="display:none">
    <h2>Click anywhere to Play</h2>
    <p>WASD move &nbsp;|&nbsp; Mouse aim &nbsp;|&nbsp; Click shoot &nbsp;|&nbsp; <b>SPACE</b> jump &nbsp;|&nbsp; <b>SHIFT</b> sprint</p>
    <p class="sub">ESC to pause</p>
  </div>

  <!-- INVITE PANEL — separate div, never clobbered -->
  <div id="invite-panel" style="display:none">
    <span>🔗 Invite friends:</span>
    <span id="overlay-invite-url"></span>
    <button id="overlay-invite-copy">Copy link</button>
    <span id="overlay-peers"></span>
  </div>

  <!-- HUD -->
  <div id="hud" style="display:none">

    <!-- Per-weapon crosshair: class swapped by crosshair.js -->
    <div id="crosshair" class="ch-default">
      <div class="ch-top"></div>
      <div class="ch-bottom"></div>
      <div class="ch-left"></div>
      <div class="ch-right"></div>
      <div class="ch-dot"></div>
      <div class="ch-circle"></div>
    </div>

    <!-- Sniper scope overlay (shown on RMB) -->
    <div id="scope-overlay">
      <div class="scope-mask"></div>
      <div class="scope-ring"></div>
      <div class="scope-h"></div>
      <div class="scope-v"></div>
      <div class="scope-tick scope-tick-l"></div>
      <div class="scope-tick scope-tick-r"></div>
      <div class="scope-tick scope-tick-u"></div>
      <div class="scope-tick scope-tick-d"></div>
      <div class="scope-dot"></div>
    </div>

    <div id="hitmarker">✕</div>
    <div id="muzzle-flash"></div>
    <div id="damage-flash"></div>

    <!-- Invite bar (shown after connecting) -->
    <div id="invite-bar" style="display:none">
      <span>🔗 Invite:</span>
      <span id="invite-url"></span>
      <button id="invite-copy">Copy</button>
    </div>

    <!-- Status + kill feed -->
    <div id="mp-status">Connecting...</div>
    <div id="kill-feed"></div>

    <!-- Bottom bar -->
    <div id="bottom-hud">
      <div class="hud-block">
        <span class="hud-label">HP</span>
        <span id="hp" class="hud-value">100</span>
      </div>
      <div class="hud-block center">
        <span id="class-name" class="hud-value">-</span>
        <span id="weapon-name" class="hud-label">-</span>
      </div>
      <div class="hud-block right">
        <span class="hud-label">KILLS</span>
        <span id="kills" class="hud-value">0</span>
        <span class="hud-label" style="margin-top:6px">AMMO</span>
        <span id="ammo" class="hud-value">∞</span>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
